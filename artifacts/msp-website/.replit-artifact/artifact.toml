kind = "web"
previewPath = "/msp/"
title = "MSP Platform Website"
version = "1.0.0"
id = "artifacts/msp-website"
router = "path"

[[services]]
name = "web"
paths = [ "/msp/" ]
localPort = 23333

[services.development]
run = "pnpm --filter @workspace/msp-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/msp-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/msp-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23333"
BASE_PATH = "/msp/"
