<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>*{box-sizing:border-box}a{text-decoration:none}.sm-solutions-dd a:hover{background:rgba(59,130,246,.1);color:#f8fafc}.sm-solutions-wrap:hover .sm-solutions-dd{display:flex!important}</style>
</helmet>
<header style="position:sticky;top:0;z-index:50;background:linear-gradient(90deg, rgba(2,6,23,.92), rgba(0,180,216,.05) 40%, rgba(139,92,246,.08) 70%, rgba(59,130,246,.1) 100%);backdrop-filter:blur(10px);border-bottom:1px solid rgba(30,41,59,.9)">
  <div style="max-width:1200px;margin:0 auto;padding:9px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:nowrap">
    <a href="Marketing Home.dc.html" style="display:flex;align-items:center;gap:10px;flex-shrink:0;order:1">
      <div style="width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff">SM</div>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-size:15px;font-weight:700;color:#f8fafc">Shane McCaw</span>
        <span style="font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#64748b">M365 Architecture</span>
      </div>
    </a>
    <a href="Marketing Free Scan.dc.html" style="flex-shrink:0;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#3b82f6,#8b5cf6);white-space:nowrap;order:3">Scan My Tenant &#183; Free</a>
    <nav style="display:flex;gap:0;flex-wrap:wrap;flex:1 1 auto;min-width:0;justify-content:center;align-items:center;row-gap:4px;order:2">
      <a href="Marketing Home.dc.html" style="{{ homeCss }}">Home</a>
      <div class="sm-solutions-wrap" style="position:relative">
        <span style="{{ watchCss }}display:inline-flex;align-items:center;gap:5px">What We Watch <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
        <div class="sm-solutions-dd" style="display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;z-index:60">
          <div style="display:flex;gap:6px;padding:10px;border-radius:12px;background:#0b1524;border:1px solid rgba(30,41,59,.9);box-shadow:0 16px 40px rgba(2,6,23,.6)">
            <div style="display:flex;flex-direction:column;min-width:200px">
              <span style="padding:4px 11px 7px;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#475569">The six pillars</span>
              <sc-for list="{{ pillars }}" as="p" hint-placeholder-count="6">
                <a href="{{ p.href }}" style="display:flex;align-items:center;gap:9px;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#94a3b8"><span style="{{ p.tileCss }}" dangerouslySetInnerHTML="{{ p.iconHtml }}"></span>{{ p.label }}</a>
              </sc-for>
            </div>
            <div style="width:1px;background:rgba(30,41,59,.9)"></div>
            <div style="display:flex;flex-direction:column;min-width:190px">
              <span style="padding:4px 11px 7px;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#475569">Deep dives</span>
              <sc-for list="{{ dives }}" as="s" hint-placeholder-count="7">
                <a href="{{ s.href }}" style="display:block;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;color:#94a3b8">{{ s.label }}</a>
              </sc-for>
              <a href="Marketing Solutions.dc.html" style="display:block;margin-top:4px;padding:8px 11px;border-top:1px solid rgba(30,41,59,.9);font-size:12px;font-weight:700;white-space:nowrap;color:#60a5fa">All 33 projects &#8594;</a>
            </div>
          </div>
        </div>
      </div>
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" style="{{ it.css }}">{{ it.label }}</a>
      </sc-for>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PILLAR_ICONS = {
  Governance: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path>',
  Security: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
  Compliance: '<path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-2 6h4z"></path><path d="M19 7l2 6h-4z"></path><path d="M8 21h8"></path>',
  Licensing: '<circle cx="12" cy="12" r="10"></circle><path d="M12 6v12"></path><path d="M15 9.5a2.5 2.5 0 0 0-2.5-2h-1a2.5 2.5 0 0 0 0 5h1a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 1-2.5-2"></path>',
  Adoption: '<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
  Health: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>',
};
const PILLARS = [
  { label: 'Governance', color: '#3b82f6', href: 'Marketing Pillar - Governance.dc.html' },
  { label: 'Security', color: '#8b5cf6', href: 'Marketing Pillar - Security.dc.html' },
  { label: 'Compliance', color: '#e2e8f0', href: 'Marketing Pillar - Compliance.dc.html' },
  { label: 'Licensing', color: '#14b8a6', href: 'Marketing Pillar - Licensing.dc.html' },
  { label: 'Adoption', color: '#f97316', href: 'Marketing Pillar - Adoption.dc.html' },
  { label: 'Health', color: '#22c55e', href: 'Marketing Pillar - Health.dc.html' },
];
const DIVES = [
  { label: 'Copilot & AI', href: 'Marketing Solutions - Copilot.dc.html' },
  { label: 'Governance projects', href: 'Marketing Solutions - Governance.dc.html' },
  { label: 'SharePoint', href: 'Marketing Solutions - SharePoint.dc.html' },
  { label: 'Power Platform', href: 'Marketing Solutions - Power Platform.dc.html' },
  { label: 'Teams', href: 'Marketing Solutions - Teams.dc.html' },
  { label: 'Migration', href: 'Marketing Solutions - Migration.dc.html' },
  { label: 'M365 Health', href: 'Marketing Solutions - M365 Health.dc.html' },
];
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current || 'home';
    const defs = [
      { key: 'monitoring', label: 'Monitoring', href: 'Marketing Monitoring.dc.html' },
      { key: 'quickstart', label: 'Quick-Start', href: 'Marketing Quick-Start Packs.dc.html' },
      { key: 'retainers', label: 'Retainers', href: 'Marketing Retainers.dc.html' },
      { key: 'pricing', label: 'Pricing', href: 'Marketing Pricing.dc.html' },
    ];
    const linkCss = (on, extra) => 'padding:7px 8px;border-radius:7px;font-size:12px;font-weight:' + (on ? '700' : '600') +
      ';white-space:nowrap;' + (extra || '') +
      (on ? 'color:#f8fafc;box-shadow:inset 0 -2px 0 0 #60a5fa;' : 'color:#94a3b8;');
    const items = defs.map(d => ({ ...d, css: linkCss(d.key === current) }));
    const watchCss = linkCss(current === 'watch' || current === 'solutions', 'cursor:default;');
    const homeCss = linkCss(current === 'home');
    return {
      items, watchCss, homeCss, dives: DIVES,
      pillars: PILLARS.map(p => ({
        ...p,
        tileCss: 'flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:' + p.color + '1A;border:1px solid ' + p.color + '33',
        iconHtml: { __html: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="' + p.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + PILLAR_ICONS[p.label] + '</svg>' },
      })),
    };
  }
}
</script>
</body>
</html>
