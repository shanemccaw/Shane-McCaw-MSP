<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Shane's Life — Vault Autofill settings</title>
<style>
  body { font: 14px system-ui, sans-serif; padding: 20px; max-width: 420px; color: #1a1a1a; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 12px; padding: 8px 16px; font: inherit; border: none; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; }
  p.status { margin-top: 12px; font-size: 13px; }
  p.hint { color: #666; font-size: 12px; }
</style>
</head>
<body>
  <h3>Shane's Life — Vault Autofill</h3>
  <label for="appUrl">App URL</label>
  <input id="appUrl" type="url" placeholder="http://localhost:5000" />
  <p class="hint">
    Where the real Shane's Life app runs. Local dev today; the real hosted URL once #3107's
    deployment happens (that's Shane's own step, not this extension's). Saving asks the browser
    to let this extension talk to that one origin only.
  </p>
  <button id="save">Save</button>
  <p class="status" id="status"></p>
  <script src="options.js" type="module"></script>
</body>
</html>
