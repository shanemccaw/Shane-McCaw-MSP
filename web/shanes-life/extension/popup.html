<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Vault Autofill</title>
<style>
  /* The design's own dark card skin (Shanes Life 19, 1b) as plain literals -- a popup.html has
     no access to the app's own Tailwind/token stylesheet, so these are the same real hex
     values `_ds`'s tokens resolve to for this palette, not a re-derivation. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 340px;
    max-height: 560px;
    overflow-y: auto;
    background: #0B1B2E;
    color: #EEF2F8;
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
  }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  .head-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(148, 163, 184, .18);
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
  }
  .head-text { flex: 1; min-width: 0; }
  .head-title { font-size: 14px; font-weight: 700; }
  .head-sub { font-size: 11.5px; color: #8597AD; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .trust-card {
    margin: 0 14px; padding: 10px 12px; border-radius: 12px;
    background: rgba(52, 211, 153, .1); border: 1px solid rgba(52, 211, 153, .3);
  }
  .trust-card.untrusted { background: rgba(251, 191, 36, .1); border-color: rgba(251, 191, 36, .3); }
  .trust-row { display: flex; justify-content: space-between; font-size: 12px; }
  .trust-title { font-weight: 600; color: #34d399; }
  .trust-card.untrusted .trust-title { color: #fbbf24; }
  .trust-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 6px; }
  .trust-fill { height: 100%; background: #34d399; border-radius: 999px; }

  .search {
    margin: 10px 14px 0; height: 36px; border-radius: 999px;
    background: #14263C; border: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
  }
  .search input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: #EEF2F8; font: inherit; outline: none;
  }
  .search input::placeholder { color: #8597AD; }

  .section-label {
    padding: 12px 14px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: #8597AD;
  }
  .list { margin: 0 14px; background: #14263C; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .row + .row { border-top: 1px solid rgba(255,255,255,.08); }
  .row-text { flex: 1; min-width: 0; }
  .row-label { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .row-user { font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: #8597AD; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lock { color: #fbbf24; flex-shrink: 0; }

  .btn {
    height: 30px; padding: 0 12px; border-radius: 999px; font: 12.5px/30px inherit; font-weight: 600;
    border: 0; cursor: pointer; flex-shrink: 0; color: #fff; background: #1A8CFF;
  }
  .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #EEF2F8; }
  .btn.link { background: none; border: 0; color: #60a5fa; padding: 0; height: auto; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }

  .muted { color: #8597AD; }
  .empty { padding: 10px 14px 4px; color: #8597AD; }

  .footer {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px 14px; font-size: 12px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="head-icon">🔐</div>
    <div class="head-text">
      <div class="head-title">Vault Autofill</div>
      <div class="head-sub" id="site-line">Checking this tab…</div>
    </div>
  </div>

  <div id="trust-card"></div>

  <div class="search">
    <span>🔎</span>
    <input id="search-input" type="text" placeholder="Find a login" autocomplete="off" />
  </div>

  <div class="section-label">For this site</div>
  <div class="list" id="site-list"><div class="empty">Checking…</div></div>

  <div class="section-label">Everything else</div>
  <div class="list" id="other-list"><div class="empty">Loading…</div></div>

  <div class="footer">
    <button class="btn link" id="open-vault">Open the Vault</button>
    <button class="btn link" id="forget-device">Forget this Chrome</button>
    <a class="btn link" href="options.html" target="_blank" style="text-decoration:none">Settings</a>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
