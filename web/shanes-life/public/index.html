<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Shane's Life</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- #07182c = hsl(213 74% 10%) = the real ported --background dark token; meta
         theme-color can't read CSS custom properties so it's inlined here verbatim. -->
    <meta name="theme-color" content="#07182c" />
    <meta name="description" content="One box for everything." />

    <!-- Home Screen delivery (contract pack Section 10): a standalone site added to the Home
         Screen, not Expo, not a native app. These four lines are what make iOS treat it as one. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shane's Life" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <!-- Real Shane McCaw MSP design-system tokens (Git #3120), ported verbatim from
         Design/design_handoff_shanes_life/_ds/…/tokens/. app.css consumes these via
         hsl(var(--...)), matching the design handoff's own usage pattern. -->
    <link rel="stylesheet" href="/tokens/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- The sign-in fox (critter 1t, "Shanes Life 14 - Critters.dc.html"). Fixed, never rolled --
         the app's face, per the handoff README's Critters section -- shared by both auth screens
         below via <use>. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="gFox" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FDBA74" />
          <stop offset="1" stop-color="#EA580C" />
        </linearGradient>
        <symbol id="c-fox" viewBox="0 0 120 120">
          <ellipse cx="60" cy="108" rx="50" ry="9" fill="#1E3A8A" opacity=".7" />
          <path d="M36 92 C 12 98 4 72 16 60 C 22 56 28 62 25 70 C 21 80 28 88 42 86 Z" fill="url(#gFox)" />
          <path d="M16 60 C 10 66 8 76 13 82 C 20 77 23 71 25 66 Z" fill="#FEF3C7" />
          <path d="M60 34 C 40 34 30 60 32 88 C 33 100 46 105 60 105 C 74 105 87 100 88 88 C 90 60 80 34 60 34 Z" fill="url(#gFox)" />
          <path d="M60 56 C 51 56 46 72 47 94 C 51 100 69 100 73 94 C 74 72 69 56 60 56 Z" fill="#FEF3C7" opacity=".92" />
          <path d="M46 26 L41 5 L59 20 Z" fill="#F97316" />
          <path d="M74 26 L79 5 L61 20 Z" fill="#F97316" />
          <path d="M47 22 L44 11 L54 19 Z" fill="#7C2D12" />
          <path d="M73 22 L76 11 L66 19 Z" fill="#7C2D12" />
          <circle cx="60" cy="36" r="19" fill="url(#gFox)" />
          <ellipse cx="60" cy="43" rx="11" ry="7" fill="#FEF3C7" />
          <circle cx="60" cy="44" r="2.2" fill="#7C2D12" />
          <circle cx="53" cy="34" r="1.9" fill="#1F2937" />
          <circle cx="67" cy="34" r="1.9" fill="#1F2937" />
          <ellipse cx="50" cy="103" rx="8" ry="4" fill="#F97316" />
          <ellipse cx="70" cy="103" rx="8" ry="4" fill="#F97316" />
        </symbol>
      </defs>
    </svg>

    <!-- Sign-in. Passkey only -- design handoff screen 1 ("Sign in") draws exactly these two
         controls and no email or password field. Shared list links never reach this screen.
         Nothing else in the app renders until this passes. -->
    <main id="login-view" class="centered" hidden>
      <section class="card auth-card">
        <svg viewBox="0 0 120 120" width="128" height="128" class="auth-mark" role="img" aria-hidden="true"><use href="#c-fox" /></svg>
        <h1>Shane's Life</h1>
        <p class="muted auth-tagline">Private. Just you.</p>
        <h2 class="auth-heading">Sign in</h2>
        <button type="button" class="primary auth-primary" id="passkey-signin">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="auth-icon">
            <path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" />
            <path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" /><path d="M9 9h.01" /><path d="M15 9h.01" />
          </svg>
          <span id="passkey-signin-label">Continue with Face ID</span>
        </button>
        <button type="button" class="ghost auth-secondary" id="passkey-signin-other">
          Use a passkey from another device
        </button>
        <p id="login-error" class="error" role="alert" hidden></p>
        <p class="auth-footnote">No passwords. Shared list links never need this screen.</p>
      </section>
    </main>

    <!-- Enrolment. Reached only by opening a single-use link from `npm run create-user` or
         `npm run enroll-passkey`; the token rides in the URL fragment so it never reaches a
         server log. -->
    <main id="enroll-view" class="centered" hidden>
      <section class="card auth-card">
        <svg viewBox="0 0 120 120" width="128" height="128" class="auth-mark" role="img" aria-hidden="true"><use href="#c-fox" /></svg>
        <h1>Shane's Life</h1>
        <p class="muted auth-tagline">Private. Just you.</p>
        <h2 class="auth-heading">Add this device</h2>
        <button type="button" class="primary auth-primary" id="passkey-enroll">
          <span id="passkey-enroll-label">Create a passkey</span>
        </button>
        <p id="enroll-error" class="error" role="alert" hidden></p>
        <p class="auth-footnote">This link works once. After that, Face ID is all you need.</p>
      </section>
    </main>

    <!-- The app itself. -->
    <div id="app-view" hidden>
      <header class="app-header">
        <h1 id="view-title">Today</h1>
        <button id="sign-out" class="ghost small">Sign out</button>
      </header>

      <main id="view" class="view" aria-live="polite"></main>

      <!-- The universal capture box. It is fixed to the bottom of every screen on purpose:
           contract pack Section 3 makes this the single entry point, and Section 2 names capture
           friction as the core enemy. It is never a category-specific form. -->
      <form id="capture" class="capture">
        <div id="capture-attachment" class="attachment" hidden>
          <span id="capture-attachment-label"></span>
          <button type="button" id="capture-attachment-clear" class="ghost small">Remove</button>
        </div>
        <div class="capture-row">
          <textarea
            id="capture-text"
            rows="1"
            placeholder="Say anything…"
            aria-label="Capture anything"
          ></textarea>
          <button type="button" id="capture-photo" class="icon-btn" title="Attach a photo" aria-label="Attach a photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </button>
          <button type="button" id="capture-voice" class="icon-btn" title="Record a voice note" aria-label="Record a voice note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button type="submit" id="capture-send" class="primary small">Save</button>
        </div>
        <p id="capture-status" class="capture-status" role="status"></p>
        <input type="file" id="capture-file" accept="image/*" capture="environment" hidden />
      </form>

      <nav class="tabs">
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/shopping" data-tab="shopping">Shopping</a>
        <a href="#/recipes" data-tab="recipes">Recipes</a>
        <a href="#/inbox" data-tab="inbox">Inbox <span id="inbox-badge" class="badge" hidden></span></a>
        <a href="#/things" data-tab="things">Things</a>
        <a href="#/settings" data-tab="settings">Settings</a>
      </nav>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
