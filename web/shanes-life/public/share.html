<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shared list</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101317" />
    <!-- A shared link must never be indexed: the URL is the credential. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- Deliberately no sign-in prompt, no tabs, no capture box. Whoever opens this was handed a
         link, not an account (contract pack Section 9). -->
    <header class="app-header">
      <h1 id="title">Shared</h1>
      <span id="mode" class="chip"></span>
    </header>
    <main id="view" class="view" style="padding-bottom:3rem" aria-live="polite"></main>
    <script type="module" src="/share.js"></script>
  </body>
</html>
