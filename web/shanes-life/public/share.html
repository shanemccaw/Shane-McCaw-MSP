<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Shared list</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- #07182c = hsl(213 74% 10%) = the real ported --background dark token; meta
         theme-color can't read CSS custom properties so it's inlined here verbatim. -->
    <meta name="theme-color" content="#07182c" />
    <!-- A shared link must never be indexed: the URL is the credential. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="stylesheet" href="/tokens/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- Deliberately no sign-in prompt, no tabs, no capture box, and (Git #3184) no generic
         app-header bar either -- the real design ("Shanes Life 12 - Shared list.dc.html", 1t)
         puts the badge/title/subtitle inline in the page itself, not in a chrome row, since
         whoever opens this was handed a link, not an account (contract pack Section 9). -->
    <main id="view" class="view share-page" aria-live="polite"></main>
    <script type="module" src="/share.js"></script>
  </body>
</html>
