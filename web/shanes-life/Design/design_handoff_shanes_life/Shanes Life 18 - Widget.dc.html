<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0;height:100%;background:#07182C}
a{color:#EEF2F8}a:hover{color:#EEF2F8}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gBear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7D2FE"></stop><stop offset="1" stop-color="#818CF8"></stop></linearGradient><symbol id="c-bear" viewBox="0 0 120 120"><ellipse cx="60" cy="108" rx="48" ry="8" fill="#1E3A8A" opacity=".7"></ellipse><circle cx="37" cy="28" r="9" fill="#A5B4FC"></circle><circle cx="83" cy="28" r="9" fill="#A5B4FC"></circle><path d="M60 20 C 30 20 18 50 20 80 C 21 98 40 106 60 106 C 80 106 99 98 100 80 C 102 50 90 20 60 20 Z" fill="url(#gBear)"></path><ellipse cx="60" cy="47" rx="12" ry="8" fill="#E0E7FF"></ellipse><ellipse cx="60" cy="45" rx="4.2" ry="2.6" fill="#4338CA"></ellipse><circle cx="50" cy="37" r="2.4" fill="#312E81"></circle><circle cx="70" cy="37" r="2.4" fill="#312E81"></circle><path d="M34 74 L60 80 L86 74 L86 96 L60 102 L34 96 Z" fill="#F8FAFC"></path><path d="M60 80 V102" stroke="#CBD5E1" stroke-width="2"></path><path d="M40 82 L54 85 M40 88 L54 91 M66 85 L80 82 M66 91 L80 88" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round"></path></symbol></defs></svg>
<sc-if value="{{ small }}" hint-placeholder-val="{{ true }}">
<div style="box-sizing:border-box;width:100%;height:100vh;min-height:150px;padding:14px 14px 13px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 60% at 50% -10%,rgba(251,191,36,.16),rgba(251,191,36,0) 70%) #07182C;color:#EEF2F8;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;min-width:0">
<div style="width:38px;height:38px;border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;background:rgba(251,191,36,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="32" height="32" viewBox="0 0 120 120"><use href="#c-bear"></use></svg></div>
<div style="min-width:0;flex:1">
<div style="font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8597AD">Available</div>
<div style="font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;color:{{ moodColor }}">{{ availText }}</div>
<div style="font-size:10.5px;color:#8597AD;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ moneyNote }}</div>
</div>
</div>
<a href="{{ href }}" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#EEF2F8;padding-top:10px;border-top:1px solid #22364F;min-width:0">
<div style="flex:1;min-width:0">
<div style="font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8597AD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ nextEyebrow }}</div>
<div style="font-size:13px;font-weight:600;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ nextText }}</div>
</div>
<span style="width:26px;height:26px;border-radius:999px;background:#1A8CFF;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
</a>
</div>
</sc-if>
<sc-if value="{{ medium }}" hint-placeholder-val="{{ false }}">
<div style="box-sizing:border-box;width:100%;height:100vh;min-height:150px;padding:16px 18px;display:flex;align-items:stretch;gap:16px;background:radial-gradient(70% 90% at 20% -10%,rgba(251,191,36,.16),rgba(251,191,36,0) 70%) #07182C;color:#EEF2F8;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden">
<div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
<div style="width:46px;height:46px;border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;background:rgba(251,191,36,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="38" height="38" viewBox="0 0 120 120"><use href="#c-bear"></use></svg></div>
<div style="min-width:0;flex:1">
<div style="font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8597AD">Available</div>
<div style="font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;color:{{ moodColor }}">{{ availText }}</div>
<div style="font-size:11px;color:#8597AD;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ moneyNote }}</div>
</div>
</div>
<div style="width:1px;background:#22364F;flex-shrink:0"></div>
<a href="{{ href }}" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#EEF2F8;flex:1.15;min-width:0">
<div style="flex:1;min-width:0">
<div style="font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8597AD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ nextEyebrow }}</div>
<div style="font-size:15px;font-weight:600;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ nextText }}</div>
</div>
<span style="width:30px;height:30px;border-radius:999px;background:#1A8CFF;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
</a>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:170,&quot;height&quot;:170},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;small&quot;,&quot;options&quot;:[&quot;small&quot;,&quot;medium&quot;],&quot;tsType&quot;:&quot;'small' | 'medium'&quot;,&quot;section&quot;:&quot;Widget&quot;},&quot;available&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:7.19,&quot;min&quot;:-5000,&quot;max&quot;:20000,&quot;step&quot;:0.01,&quot;unit&quot;:&quot;$&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Money&quot;},&quot;stillToFund&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3774,&quot;min&quot;:0,&quot;max&quot;:20000,&quot;step&quot;:1,&quot;unit&quot;:&quot;$&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Money&quot;},&quot;billsWaiting&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Money&quot;},&quot;payday&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fri&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Money&quot;},&quot;nextKind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dinner&quot;,&quot;options&quot;:[&quot;dinner&quot;,&quot;bill&quot;,&quot;appointment&quot;,&quot;groceries&quot;,&quot;headingHome&quot;,&quot;charge&quot;,&quot;nothing&quot;],&quot;tsType&quot;:&quot;'dinner' | 'bill' | 'appointment' | 'groceries' | 'headingHome' | 'charge' | 'nothing'&quot;,&quot;section&quot;:&quot;Next&quot;},&quot;nextText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Next&quot;},&quot;nextWhen&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Next&quot;},&quot;appUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;./Shanes%20Life%20-%20First%20Slice%20Prototype.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Link&quot;},&quot;today&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9/7/2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Today&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const money = n => { const v = Math.round(Math.abs(n) * 100) / 100, s = v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (n < 0 ? '-$' : '$') + s; };
    const avail = Number(p.available ?? 7.19), toFund = Number(p.stillToFund ?? 3774), waiting = Number(p.billsWaiting ?? 4), payday = p.payday ?? 'Fri';
    const mood = avail < 0 ? 'short' : toFund > avail ? 'tight' : 'fine';
    const moodColor = mood === 'fine' ? '#34d399' : mood === 'tight' ? '#fbbf24' : '#f87171';
    const moneyNote = mood === 'fine' ? 'covered till ' + payday : mood === 'tight' ? waiting + (waiting === 1 ? ' bill waits for ' : ' bills wait for ') + payday : 'short till ' + payday;
    const kind = p.nextKind ?? 'dinner';
    const AUTO = {
      dinner: { text: 'Dinner: chicken, potatoes, green beans', when: '4:00 PM', route: 'meal' },
      bill: { text: 'Tesla Loan · $1,059 due', when: 'today', route: 'money' },
      appointment: { text: 'Dr. Fonji · ask about the new BP dose', when: 'tomorrow 2:00 PM', route: 'dates' },
      groceries: { text: 'Aldi run · 9 items', when: 'near a store', route: 'shop' },
      headingHome: { text: 'Heading home? Model 3 · navigation + preconditioning', when: 'away from Home', route: 'tesla' },
      charge: { text: 'Charge tonight · 96 mi to KSC, 62 on the battery', when: 'tonight', route: 'tesla' },
      nothing: { text: 'Nothing needs you.', when: '', route: 'tray' }
    };
    const a = AUTO[kind] || AUTO.nothing, when = (p.nextWhen ?? '') || a.when;
    const size = p.size ?? 'small';
    return {
      small: size !== 'medium', medium: size === 'medium',
      availText: money(avail), moodColor, moneyNote,
      nextEyebrow: 'Next' + (when ? ' · ' + when : ''), nextText: (p.nextText ?? '') || a.text,
      href: (p.appUrl ?? './Shanes%20Life%20-%20First%20Slice%20Prototype.dc.html') + '#' + a.route
    };
  }
}
</script>
</body>
</html>
